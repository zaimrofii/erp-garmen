- id: G015
  q: "total order aktif, lalu mana yang paling lambat?"
  category: majemuk
  ground_truth: "15 order aktif (CONFIRMED 10 + IN_PROGRESS 5). Paling lambat = deadline terdekat yang belum selesai: RICH-SO-01 (29 Okt 2026, CONFIRMED, PT Retail Fashion Indonesia)."
  definition_system: "Aktif = Order.state IN [CONFIRMED, IN_PROGRESS] (DRAFT/DONE/CANCELLED dikecualikan). Paling lambat = deadline terdekat yang belum selesai (bukan progress qty), karena definisi progress butuh agregasi WO yang tidak stabil antar order."
  query: "Order.objects.filter(state__in=['CONFIRMED','IN_PROGRESS']).count()  # =15 ; .order_by('deadline').values('code','deadline').first()  # RICH-SO-01 2026-10-29"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-23"
  verified_by: manual_orm
  check: {type: numeric, numbers: [15], entities: ["rich-so-01"]}

