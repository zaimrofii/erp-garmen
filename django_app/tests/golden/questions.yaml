- id: G008
  q: "berapa persen scrap SEWING-2 minggu ini?"
  category: scrap_rate
  ground_truth: "70% — kohort bundle DONE yang FINISH minggu ini: 7 scrap / 10 qty_done (1 bundle). CATATAN: formula produksi lama memberi 385% (77 scrap / 20 output) karena pembilang & penyebut beda kohort; angka 70% adalah definisi yang dituju Fase 0.4."
  query: "done=Bundle.objects.filter(state='DONE', events__event_type='BUNDLE_FINISH', events__ts__gte=date(2026,10,19)).distinct(); ScrapAccumulator.objects.filter(bundle__in=done).aggregate(Sum('qty'))=7 ; done.aggregate(Sum('qty_done'))=10"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-22"
  verified_by: manual_orm
  check: {type: numeric, approx: 70, tol: 1.5}

- id: G009
  q: "rata-rata lead time bundle minggu ini?"
  category: lead_time
  ground_truth: "77,64 jam (27 bundle dengan START & FINISH minggu ini; median 94 jam). Angka tinggi karena artefak seed RICH-BND, bukan produksi nyata."
  query: "Bundle.annotate(s=Subquery(first BUNDLE_START), f=Subquery(last BUNDLE_FINISH)).filter(f__gte=date(2026,10,19)) -> mean((f-s)/3600)  # =77.64, n=27"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-22"
  verified_by: manual_orm
  check: {type: numeric, approx: 77.6, tol: 2.0}

