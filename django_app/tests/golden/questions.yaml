- id: G006
  set: tuning
  q: "stok produk Kaos Polos Cotton Combed 30s di gudang?"
  category: stok
  ground_truth: "30 pcs di WH/Stok (Odoo live, produk ODOO-65). Catatan: mirror MES (InventoryAdjustment FG-KAOS-001) menunjukkan 102 — beda sumber, bukan beda tool."
  definition_system: "Stok = stock.quant Odoo pada lokasi usage=internal, produk ODOO-65 (kode mirror Odoo). Ada 2 produk lokal bernama sama (FG-KAOS-001 dan ODOO-65); dipilih ODOO-65 karena stok live ada di Odoo."
  query: "get_stock('ODOO-65') -> transport.search_read('stock.quant', [product_id.default_code=ODOO-65, location_id.usage=internal])  # quantity 30 (WH/Stok); lokasi virtual -30 dikecualikan"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-23"
  verified_by: manual_orm
  check: {type: numeric, numbers: [30]}

