# Golden set Fase G — 15 pertanyaan owner garmen (2026-10-22)
# Semua ground_truth dihitung dari DB lewat ORM (bukan dari output AI).
# Snapshot data: 50 produk, 73 order, 200 bundle, 93 order line, 72 baris scrap.
# "minggu ini" = Senin 2026-10-19 s/d sekarang; "bulan ini" = 2026-10-01 s/d sekarang.
# Field tambahan `check` dipakai runner_minimal.py untuk scoring otomatis.

- id: G001
  q: "berapa bundle sedang dikerjakan di SEWING-2?"
  category: wip
  ground_truth: "6 bundle (state REWORK). Total 22 bundle berada di SEWING-2: REWORK 6, SCRAP 15, DONE 1."
  definition_system: "bundle aktif di WC SEWING-2 berdasarkan posisi terakhir (current_work_center). Aktif = state IN [CUTTING, SEWING, QC, FINISHING, REWORK]; DONE/SCRAP dikecualikan karena tidak sedang dikerjakan. Catatan: daftar 4 state di brief menghasilkan 0 — REWORK ditambahkan karena masih dikerjakan."
  query: "Bundle.objects.filter(current_work_center__code='SEWING-2', state__in=['CUTTING','SEWING','QC','FINISHING','REWORK']).count()  # =6 (REWORK)"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-23"
  verified_by: manual_orm
  check: {type: numeric, numbers: [6]}

- id: G002
  q: "scrap terbesar minggu ini di work center mana?"
  category: scrap
  ground_truth: "SEWING-2, 77 pcs (total seluruh WC minggu ini 91 pcs; PACKING 6, QC-1 5)."
  query: "ScrapAccumulator.objects.filter(created_at__gte=date(2026,10,19)).values('work_center__code').annotate(q=Sum('qty')).order_by('-q').first()  # SEWING-2 77"
  source_of_truth: DB
  verified: true
  verified_at: "2026-10-22"
  verified_by: manual_orm
  check: {type: numeric, numbers: [77], entities: ["sewing-2"]}

