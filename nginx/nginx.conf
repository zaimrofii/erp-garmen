# ============================================================
# F3-B.2.2 — Nginx global config (PRODUCTION)
#
# Dipasang di service `nginx` (docker-compose.prod.yml):
#   ./nginx/nginx.conf   -> /etc/nginx/nginx.conf:ro
#   ./nginx/conf.d       -> /etc/nginx/conf.d:ro
#
# Virtual host ada di `conf.d/mes.conf`.
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `rid=$request_id` = id unik per request (dipakai juga oleh Django
    # `config.middleware.RequestIDFilter` lewat header `X-Request-ID`).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$request_id xrid=$http_x_request_id '
                    'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Jangan bocorkan versi Nginx di header Server.
    server_tokens   off;

    # Upload media (foto QC dsb.) — samakan dengan batas aplikasi.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # WebSocket: `Connection` harus "upgrade" hanya bila memang ada Upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
