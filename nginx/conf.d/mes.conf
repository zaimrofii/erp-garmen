# ============================================================
# F3-B.2.2 — Virtual host PRODUKSI (placeholder domain)
#
# GANTI `mes.klien-a.com` (server_name + path sertifikat) sesuai domain klien.
# Cert dipasang di volume ./certbot/conf -> /etc/letsencrypt
#   (dibuat oleh `scripts/generate-ssl.sh`: Let's Encrypt / self-signed bootstrap).
# ============================================================

# --- HTTP :80 — hanya untuk ACME + redirect ke HTTPS -----------------------
server {
    listen      80;
    listen      [::]:80;
    server_name mes.klien-a.com;

    # Certbot webroot (./certbot/www -> /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name mes.klien-a.com;

    ssl_certificate     /etc/letsencrypt/live/mes.klien-a.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mes.klien-a.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: aktifkan setelah yakin HTTPS stabil (Django juga mengirim HSTS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health check: proxy ke Django TANPA mengotori access log.
    location = /api/health/ {
        access_log off;
        proxy_pass http://django:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # REST API (DRF) -> Django ASGI.
    location /api/ {
        proxy_pass         http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # WebSocket event bus (`/ws/events/`) — butuh Upgrade + koneksi panjang.
    location /ws/ {
        proxy_pass         http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static Django (admin/DRF) — volume static_files (dari `collectstatic`).
    location /static/ {
        alias     /var/www/static/;
        expires   30d;
        access_log off;
    }

    # Media upload — volume media_files.
    location /media/ {
        alias     /var/www/media/;
        expires   7d;
        access_log off;
    }

    # Frontend SPA (volume frontend_dist, hasil `frontend_builder`).
    location / {
        root  /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
